# Sensorium - ten senses, installed in one row set.
#
# Every row points at a relative path inside this package (resolved next to this
# patch file), so the ten plugins do not have to be installed separately. To turn
# one off, override it by id in your own profile patch:
#
#   - id: sensorium-need-tension
#     disabled: true
#
# All rows share one workspace; state lands in <workspace>/.dsh/sensory/.
# Precedence: config.workspace -> SENSORIUM_WORKSPACE environment variable -> process cwd.
- insert:
    - id: sensorium-workspace-pulse
      name: ./plugins/workspace-pulse/index.js
      config: {}
    - id: sensorium-time-sense
      name: ./plugins/time-sense/index.js
      config: {}
    - id: sensorium-affect-core
      name: ./plugins/affect-core/index.js
      config: {}
    - id: sensorium-need-tension
      name: ./plugins/need-tension/index.js
      config: {}
    - id: sensorium-expression-bias
      name: ./plugins/expression-bias/index.js
      config: {}
    - id: sensorium-silence-gate
      name: ./plugins/silence-gate/index.js
      config: {}
    - id: sensorium-residue-trace
      name: ./plugins/residue-trace/index.js
      config: {}
    - id: sensorium-unresolved-weight
      name: ./plugins/unresolved-weight/index.js
      config: {}
    - id: sensorium-body
      name: ./plugins/body/index.js
      config: {}
    - id: sensorium-face
      name: ./plugins/face/index.js
      config: {}
